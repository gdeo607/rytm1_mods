status = "verified"
evidence = "track_index_of(this + 48), then the active-pattern getter 0x400ac2b2, then pattern_track(pattern, track) - the MKII note's description, instruction for instruction."

[fn.track_index_of]
addr = 0x400b3a04
mk2 = 0x400b68d2
status = "verified"
evidence = "Called 77 times as track_index_of(sel) right after the this+48 getter 0x400ab6ce; reads +8 of the selection's live storage."

[fn.kit_track_sound]
addr = 0x400a3d08
mk2 = 0x400a675e
status = "verified"
evidence = "The only standalone routine that clamps the track to 0..11 and returns kit + 60 + track * 352 (40 callers)."

[fn.kit_param_changed]
addr = 0x40033438
mk2 = 0x4003355c
status = "verified"
evidence = "(bank, track, id, value): writes at bank + 18 + sel*12194 + track*938 + id*2 with the selector at +0x11de4 (73188), sets bit id in +0x5f5c + sel*24388 + track*1876, sets the dirty byte at +4 and signals the lock at +8 - the MKII note's constants, all present. The entry is the clrb %d1 BEFORE the linkw (its two stock callers, 0x400a7182 and 0x400a726e, jsr here): d1 = 0 is the guard byte stored at fp-4."

[fn.is_key_held]
addr = 0x4008022e
mk2 = 0x40081bbc
status = "verified"
evidence = "Key id -> RAM table 0x40a9de08 -> bit in the key bitmap 0x40a9e568 (same 0x760 spacing as MKII's 0x418d0be0/0x418d1340). Called with pea 0x80 at the MICRO TIME ALL title, as on MKII."

[const.KEY_FUNC]
value = 0x80
status = "verified"
evidence = "The id the MK1 MICRO TIME ALL title tests (0x4004465c), and the commonest constant argument to is_key_held (12 sites)."

