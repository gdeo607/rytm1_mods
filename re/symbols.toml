status = "verified"
evidence = "Most-called function whose result is pushed straight into another call (243 sites). Lazy construction: tstl 0x416c70c0, allocate 0x3d61c bytes. The MICRO TIME ALL draw path (string ref 0x40044680) calls it, then current_track_pattern, then is_key_held(0x80), exactly as MKII's microtiming_menu_draw."

[fn.current_track_pattern]
addr = 0x400ac2e8
