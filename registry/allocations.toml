# Single source of truth for every scarce resource a mod can claim - Analog Rytm MK1,
# OS 1.73. Same rules as the MKII registry this was ported from
# (3_Claude_work/rytm-mods_MKII_peer/registry/allocations.toml): tools/layout.py
# asserts that no two claims overlap and that every claim sits inside its pool;
# tools/build.py checks every `expect` against the stock bytes before patching.
#
# Every address below is an MK1 address. Each patch and detour also records the MKII
# address it was ported from (mk2 = ...), and its `expect` bytes were matched in the
# MK1 image - for the six-byte detours, the same bytes as on MKII.
#
# owner = the mod directory name, or "reserved:<reason>".

[meta]
target = "OS1.73"
device = "Analog Rytm MK1"

# ---------------------------------------------------------------- the image
#
# From the MK1 startup code (reset entry 0x40000592):
#   0x40000506  copies 0x402a3000..0x402aa9f0 to SRAM 0x80000000..0x800079f0 and
#               0x402aa9f0..0x402b1c24 (the image's end) to 0x80008000.
#   0x4000055c  zeroes 0x402a3000..0x427a6310: __bss_start = 0x402a3000.
# So, as on MKII, everything at or above 0x402a3000 is initialiser data and then .bss,
# and NOTHING below 0x402a3000 is .bss.
#
# THE ONE MK1-ONLY TRAP: 0x4028c708..0x402a1b24 is the bootstrap, embedded in MAIN
# OS. At every boot 0x400005aa compares its version word (0x4028c708) with the one in
# flash (0x1fff8) and, if it is newer, 0x4011a738 erases the bootstrap sectors and
# writes 0x4028c710..0x402a1b24 into them. A mod byte in that range could one day be
# written into the recovery path. No pool may touch it, and tools/verify.py asserts
# its hash is stock in every build.

# ---------------------------------------------------------------------- pools

[[pool]]
name   = "cave2"
start  = 0x402a2780
end    = 0x402a3000          # exclusive; 2176 B
status = "probably-verified"
note   = """
The MK1 twin of MKII's cave2, which ran 0003 and 0004 on hardware: alignment
padding between the end of the read-only data and the first SRAM load image.

Evidence, all static, on this image:
- 0x402a277c..0x402a3000 is zeros (the run continues into the SRAM image, whose
  first bytes are zero too). The pool starts 4 bytes in to keep claims aligned.
- Just below is the C++ static-constructor table: count 130 at 0x402a2570, entries
  from 0x402a2574, so it ends exactly at 0x402a277c. (MKII: 146 entries.)
- No 32-bit word at any even offset in the image points into 0x402a2700..0x402a3000.
- 0x402a3000 is where both the SRAM copy (0x40000506) and the .bss clear
  (0x4000055c) start; the gap is below both and nothing else writes it.

Why "probably-verified" and not "candidate" before any MK1 hardware run: the static
case is complete, not an argument. The two ways a zero run can be live are closed by
the startup code itself - it is below __bss_start, so nothing clears or reuses it,
and it is above the last static constructor, so nothing reads it as a table - and
nothing in the image points into it. It is also the exact twin of MKII's cave2,
which ran 0003 and 0004 through normal use with a canary that stayed intact.
What is NOT yet done is an MK1 session: the first 0002/0003 image is that run
(code here that got overwritten would crash visibly, not fail quietly). Record the
result here and change the status to "verified" after it.
"""

[[pool]]
name   = "cave"
start  = 0x402a1b30
end    = 0x402a2000          # exclusive; 1232 B
status = "probably-verified"
note   = """
The MK1 twin of MKII's cave1 (padding at the end of the code, before the UTF-16 USB
strings). On MK1 what ends just before it is the EMBEDDED BOOTSTRAP IMAGE, whose last
byte is 0x402a1b23 (the flasher's loop bound, cmpil #0x402a1b24 at 0x4011a81e).

Evidence: 0x402a1b24..0x402a2002 is zeros; the only references into
0x402a1b00..0x402a2010 are that loop bound and two pointers to the string table at
0x402a2000. The pool keeps 12 bytes clear of the image's end on purpose.

Promoted to "probably-verified" on the same static case as cave2 (2026-09-27, for
0008): below __bss_start, so nothing clears or reuses it at run time; nothing points
into it; and it is outside the bootstrap flasher's range, whose end is the exclusive
bound 0x402a1b24 - the embedded image's own hash is checked by build and verify, so
a claim here that spilled into the image could not be built. The MKII twin (cave1)
was proven on hardware. Not yet run on an MK1: 0008's first flash is that run.
"""

[[pool]]
name   = "cave3"
start  = 0x4024db0c
end    = 0x4024df0c          # exclusive; 1024 B
status = "probably-verified"
note   = """
The MK1 twin of MKII's cave3 (0x40289ab8, 1024 B between two float tables, which ran
0003 on MKII hardware). Same shape here: 1024 B of zeros, bounded by referenced
table starts - the nearest references are 0x4024d508 below and 0x4024df0c (the next
table's start) above; nothing points inside. The same residual doubt as on MKII:
the table before it starts at 0x4024d508, so if that table ran on for 1540 B and
simply decayed to zero, the run would be live data that reads as 0.

The residual doubt is closed on MK1 (2026-09-27): the table before the run is 385
words starting at 0x4024d508 whose LAST word, 0x4024db08, is 0x48908ad9 (about 0.57
in Q31) - a table that ends on a large value, not one decaying into the run. So the
run is padding. Promoted to "probably-verified" with cave2's static argument (below
__bss_start, unreferenced) plus the MKII twin's hardware canary. It is written at
run time by 0008 (filter state), so if it were live data the filter would misbehave
audibly rather than silently.
"""

# Not yet ported: MKII's dead-code pools cave4..cave6 (whole unreachable routines),
# which 0004 and 0006 need. Their MK1 twins have to be found and re-proven.


