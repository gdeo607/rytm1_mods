# ------------------------------------------------------- 0008-sample-cut
#
# Code, page data, strings and the per-track settings in `cave`; the cutoff tables
# and the filter state in `cave3`.

[[cave]]
owner   = "0008-sample-cut"
addr    = 0x402a1b30
size    = 0x4d0
section = ".text"
note    = "The page_info / get / delta / text gates, the voice-output hook, cut_process and its two filter loops, the FILTER view's page list and the SMP CUT descriptor, and the strings."

[[cave]]
owner   = "0008-sample-cut"
addr    = 0x4024db0c
size    = 0x400
section = ".tab"
note    = "The 64-step table (a1 and g, 512 B), the popup's 21 frequency mantissas (42 B), 8 voices x 16 B of filter state written by the audio interrupt, and helpers (word_sync, value_of, put_u3, coefs). The measuring build adds two counters."

# The FILTER view's page list: {5} becomes {5, 11}. Pressing FILTER again then
# cycles to page 11 through the view's own multi-page handling.
[[patch]]
owner   = "0008-sample-cut"
addr    = 0x400c71d2
size    = 2
expect  = "7201"           # moveq #1,%d1 - page count
replace = "7202"

[[patch]]
owner       = "0008-sample-cut"
addr        = 0x400c71d8
size        = 4
expect      = "401af51c"   # the one-entry list holding page 5
from_symbol = "cut_pages"

# page_info answers page 11 from the cave; every other id goes to stock.
[[detour]]
owner  = "0008-sample-cut"
addr   = 0x400f8736
size   = 6
expect = "720a202f0004"      # moveq #10,%d1; movel %sp@(4),%d0
entry  = "page_info_gate"

# The dials: page_get_value's entry, for ids 1..2.
[[detour]]
owner  = "0008-sample-cut"
addr   = 0x400381a0
size   = 6
expect = "4feffff448d7040c"
entry  = "get_gate"

# The knobs: param_apply_delta past its prologue, where 0003's gate rejoins.
[[detour]]
owner  = "0008-sample-cut"
addr   = 0x400376e4
size   = 6
expect = "77832f2a0074"
